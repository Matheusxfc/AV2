# PostgreSQL local para desenvolvimento. Funciona igual no Windows (Docker Desktop) e no Ubuntu.
services:
  db:
    image: postgres:16-alpine
    container_name: greencode-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: greencode
      POSTGRES_PASSWORD: greencode
      POSTGRES_DB: greencode
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greencode -d greencode"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
